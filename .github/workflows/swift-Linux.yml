name: test-linux-VanguardLexicon

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: test-linux-VanguardLexicon
    runs-on: ubuntu-latest
    env:
      GIT_SSL_NO_VERIFY: true
    steps:
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.4.0"
      - uses: actions/checkout@v1
      - name: Clean
        run: swift package clean
      - name: Test
        run: swift --version && swift test -c release && swift run VCDataBuilder vanguardTextMap
