name: Swift Build (macOS-Modern)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-macos-latest:
    name: Swift Build (macOS-Modern)
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.2.0'
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
